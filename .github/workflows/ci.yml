name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a run on main: every merge keeps its own result.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install package and dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group dev
          python -m pip install .
      - run: ruff check
      - run: ruff format --check
      - run: mypy

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Runner images pinned so an image bump cannot change results without a commit.
        os: [ubuntu-24.04]
        python-version: ["3.12", "3.13", "3.14"]
        include:
          - os: macos-15
            python-version: "3.13"
          - os: windows-2025
            python-version: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      # Non-editable install: the tests run against what the wheel actually contains.
      - name: Install package and dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group dev
          python -m pip install .
      - run: python -m pytest --cov

  eval-gate:
    # Model-free evaluation (ADR-0007): a fresh run must reproduce the committed results
    # exactly, so a change that moves a number has to update the file in the same PR.
    name: Evaluation gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install package and eval tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group eval -c eval/constraints.txt
          python -m pip install . -c eval/constraints.txt
      - name: Extraction matches eval/results/extraction.json
        run: |
          askpdf eval extraction --json "$RUNNER_TEMP/extraction.json"
          diff -u eval/results/extraction.json "$RUNNER_TEMP/extraction.json"
      - name: BM25 retrieval on dev matches eval/results/dev-retrieval-bm25.json
        run: |
          askpdf eval retrieval --split dev --json "$RUNNER_TEMP/retrieval.json"
          diff -u eval/results/dev-retrieval-bm25.json "$RUNNER_TEMP/retrieval.json"
      - name: Conversations on dev match eval/results/dev-conversation-bm25.json
        run: |
          askpdf eval conversation --split dev --json "$RUNNER_TEMP/conversation.json"
          diff -u eval/results/dev-conversation-bm25.json "$RUNNER_TEMP/conversation.json"
      - name: Hand-rolled metrics agree with pytrec_eval
        run: |
          python -m pip install --group dev -c eval/constraints.txt
          python -m pytest tests/test_evaluate.py -k pytrec

  package:
    name: Build and smoke-test the wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Build
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build
      - name: Install the wheel in a clean venv and run it
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          expected="askpdf $(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$(/tmp/smoke/bin/askpdf --version)" = "$expected"
      - name: Install the sdist in a clean venv and run it
        run: |
          python -m venv /tmp/smoke-sdist
          /tmp/smoke-sdist/bin/pip install dist/*.tar.gz
          /tmp/smoke-sdist/bin/askpdf --version
